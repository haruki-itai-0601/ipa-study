name: weekly-challenge

# 毎週 日曜 朝10:00(JST) に「5問チャレンジ」を告知投稿。区分は毎週ローテーション。
#   日10:00 JST = 日01:00 UTC
on:
  # ⏸ 自動配信は一時停止中（サイト完成後に内容を切り替えて再開予定）。
  #   再開するには下の schedule のコメントを外す。手動実行は workflow_dispatch で可能。
  # schedule:
  #   - cron: "0 1 * * 0"
  workflow_dispatch: {}

concurrency:
  group: weekly-challenge
  cancel-in-progress: false

jobs:
  challenge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Post weekly challenge to X
        run: node scripts/post-challenge.mjs
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
