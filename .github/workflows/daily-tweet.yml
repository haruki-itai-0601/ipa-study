name: daily-tweet

# 毎日 朝7:30 と 夜19:00(JST) に「今日の1問」を1ツイートずつ自動投稿（計2本/日）。
#   07:30 JST = 22:30 UTC（前日） / 19:00 JST = 10:00 UTC
# ※GitHub Actionsのスケジュールは数分〜十数分ずれることがあります（仕様）。
# ※X APIは投稿1回ごとに課金（URL付き$0.20≒約30円）。2本/日で月約$12≒1,800円。残高が必要。
on:
  # ⏸ 自動配信は一時停止中（サイト完成後に内容を切り替えて再開予定）。
  #   再開するには下の schedule のコメントを外す。手動実行は workflow_dispatch で可能。
  # schedule:
  #   - cron: "30 22 * * *"
  #   - cron: "0 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-tweet
  cancel-in-progress: false

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Post one question to X
        run: node scripts/post-to-x.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
