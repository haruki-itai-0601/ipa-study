name: 今日の1問・サービスPRをXに自動投稿

on:
  schedule:
    # GitHub Actions は UTC。混雑ピーク(:00)を避け、遅延しても適時に着弾するよう調整。
    # 出題は通勤帯(7〜9時)の頭、答え合わせは帰宅帯〜在宅ゴールデンタイム(19〜21時)に着弾させる。
    - cron: "45 21 * * *" # 06:45 JST発火 → 遅延込みで7時台に「今日の1問」（アンケート）
    - cron: "45 9 * * *"  # 18:45 JST発火 → 遅延込みで19時台に答え合わせ（朝の投票へのリプ）
  workflow_dispatch: # Actionsタブから手動実行も可能（投稿タイプを選べる）
    inputs:
      post_type:
        description: "投稿タイプ（question=問題 / explain=解説 / pr=サービスPR）"
        default: "explain"

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Post tweet
        env:
          # 朝(21:45 UTC)=問題、夕(09:45 UTC)=解説。サービスPRは手動実行(post_type=pr)で出す。
          POST_TYPE: ${{ github.event.inputs.post_type || (github.event.schedule == '45 9 * * *' && 'explain' || 'question') }}
          # Secret名は X_API_KEY/X_API_SECRET（コンシューマーキー）。スクリプトのenv名へマッピング
          X_APP_KEY: ${{ secrets.X_API_KEY }}
          X_APP_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/post-tweet.mjs
