name: 今日の1問・サービスPRをXに自動投稿

on:
  schedule:
    # GitHub Actions は UTC。JST(UTC+9)の朝8時=問題アンケート、夕19時=サービスPR
    - cron: "0 23 * * *" # 08:00 JST → 今日の1問（アンケート）
    - cron: "0 10 * * *" # 19:00 JST → サービスPR
  workflow_dispatch: # Actionsタブから手動実行も可能（投稿タイプを選べる）
    inputs:
      post_type:
        description: "投稿タイプ（question=問題 / pr=サービスPR）"
        default: "question"

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Post tweet
        env:
          # 朝(23:00 UTC)=問題、夕(10:00 UTC)=サービスPR。手動実行時は入力値を優先。
          POST_TYPE: ${{ github.event.inputs.post_type || (github.event.schedule == '0 10 * * *' && 'pr' || 'question') }}
          # Secret名は X_API_KEY/X_API_SECRET（コンシューマーキー）。スクリプトのenv名へマッピング
          X_APP_KEY: ${{ secrets.X_API_KEY }}
          X_APP_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/post-tweet.mjs
